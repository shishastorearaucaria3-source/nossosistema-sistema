appId: br.com.lojatabacaria.sistema
productName: Sistema Loja Tabacaria
executableName: NossoSistema
directories:
  output: dist-setup
files:
  - out/**/*
  - "!out/setup-launcher/**/*"
  - "!out/autoupdate/**/*"
  - package.json
asarUnpack:
  - "**/*.node"
  - out/server/**/*
  - out/shared/**/*
  - node_modules/express/**/*
  - node_modules/adm-zip/**/*
  - node_modules/send/**/*
  - node_modules/serve-static/**/*
  - node_modules/finalhandler/**/*
  - node_modules/utils-merge/**/*
  - node_modules/methods/**/*
  - node_modules/encodeurl/**/*
  - node_modules/escape-html/**/*
  - node_modules/parseurl/**/*
  - node_modules/path-to-regexp/**/*
  - node_modules/range-parser/**/*
  - node_modules/statuses/**/*
  - node_modules/mime-types/**/*
  - node_modules/mime-db/**/*
  - node_modules/on-finished/**/*
  - node_modules/depd/**/*
  - node_modules/http-errors/**/*
  - node_modules/inherits/**/*
  - node_modules/setprototypeof/**/*
  - node_modules/toidentifier/**/*
  - node_modules/qs/**/*
  - node_modules/side-channel/**/*
  - node_modules/call-bind/**/*
  - node_modules/call-bound/**/*
  - node_modules/get-intrinsic/**/*
  - node_modules/object-inspect/**/*
  - node_modules/bytes/**/*
  - node_modules/content-disposition/**/*
  - node_modules/cookie/**/*
  - node_modules/cookie-signature/**/*
  - node_modules/fresh/**/*
  - node_modules/merge-descriptors/**/*
  - node_modules/ms/**/*
  - node_modules/safe-buffer/**/*
  - node_modules/vary/**/*
  - node_modules/iconv-lite/**/*
  - node_modules/safer-buffer/**/*
  - node_modules/es-errors/**/*
  - node_modules/es-object-atoms/**/*
  - node_modules/es-define-property/**/*
  - node_modules/gopd/**/*
  - node_modules/hasown/**/*
  - node_modules/function-bind/**/*
  - node_modules/has-symbols/**/*
  - node_modules/side-channel-list/**/*
  - node_modules/side-channel-map/**/*
  - node_modules/side-channel-weakmap/**/*
extraResources:
  - from: build/icones/servidor.ico
    to: servidor.ico
  - from: build/icones/sistema.ico
    to: sistema.ico
  - from: src/panel-servidor
    to: servidor-panel
win:
  icon: build/icones/sistema.png
  target:
    - nsis
nsis:
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: false
  createStartMenuShortcut: false
  runAfterFinish: false
  deleteAppDataOnUninstall: false
  artifactName: NossoSistema-Setup.exe
  include: build/installer.nsh
