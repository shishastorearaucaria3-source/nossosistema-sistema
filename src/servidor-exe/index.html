<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Servidor do Sistema</title>
<style>
:root{--bg:#0f172a;--sidebar:#111c30;--sidebar-ativa:#1e3a5f;--card:#1e293b;--card2:#273449;--line:#334155;--text:#e2e8f0;--muted:#94a3b8;--green:#22c55e;--red:#ef4444;--amber:#f59e0b;--blue:#3b82f6}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);height:100vh;display:flex;overflow:hidden}
/* Sidebar */
.sidebar{width:230px;min-width:230px;background:var(--sidebar);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:18px 0}
.brand{display:flex;align-items:center;gap:12px;padding:0 18px 20px;border-bottom:1px solid var(--line);margin-bottom:10px}
.brand .logo{width:42px;height:42px;border-radius:10px;background:var(--green);color:#052e16;font-weight:800;font-size:20px;display:flex;align-items:center;justify-content:center}
.brand h1{font-size:16px;font-weight:700;line-height:1.2}
.brand small{display:block;font-size:11px;color:var(--muted);font-weight:400}
.menu{flex:1;display:flex;flex-direction:column;padding:0 10px;gap:2px;overflow-y:auto}
.menu-titulo{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;padding:12px 10px 6px}
.menu-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;font-size:13px;color:var(--text);cursor:pointer;border:none;background:none;font-family:inherit;text-align:left}
.menu-item:hover{background:rgba(255,255,255,.05)}
.menu-item.ativa{background:var(--sidebar-ativa);font-weight:600}
.menu-item .ico{width:18px;text-align:center;flex:0 0 auto}
.sidebar-rodape{border-top:1px solid var(--line);padding:14px 18px;font-size:11px;color:var(--muted)}
.sidebar-rodape .status{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.sidebar-rodape .dot{width:9px;height:9px;border-radius:50%;background:var(--muted)}
.sidebar-rodape .dot.online{background:var(--green)}
.sidebar-rodape .dot.offline{background:var(--red)}
/* Conteúdo */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.topo{display:flex;align-items:center;justify-content:space-between;padding:14px 24px;background:var(--card);border-bottom:1px solid var(--line)}
.topo h2{font-size:18px;font-weight:700}
.topo-acoes{display:flex;gap:8px}
.topo-acoes button{padding:8px 14px;border-radius:8px;border:1px solid var(--line);background:var(--card2);color:var(--text);font-size:12px;font-weight:600;cursor:pointer;font-family:inherit}
.topo-acoes button:hover{background:#475569}
.topo-acoes button.sair{background:var(--red);border-color:var(--red);color:#fff}
.topo-acoes button.sair:hover{background:#dc2626}
.conteudo{flex:1;overflow-y:auto;padding:24px;display:flex;flex-direction:column;gap:20px}
/* Cards de status */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
.card .titulo{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px}
.card .valor{font-size:20px;font-weight:800}
.card .valor.ok{color:var(--green)}
.card .valor.warn{color:var(--amber)}
.card .valor.erro{color:var(--red)}
.card .sub{font-size:11px;color:var(--muted);margin-top:4px}
.secao{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px}
.secao h3{font-size:15px;font-weight:700;margin-bottom:14px}
.grid-info{display:grid;grid-template-columns:1fr 1fr;gap:0 20px}
@media(max-width:700px){.grid-info{grid-template-columns:1fr}}
.grid-info .item{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px}
.grid-info .item span{color:var(--muted)}
.grid-info .item strong{text-align:right;word-break:break-all}
.fld label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:4px}
.fld input:focus{border-color:var(--green);box-shadow:0 0 0 3px rgba(34,197,94,.12);outline:none}
/* Logs */
.logs{max-height:300px;overflow-y:auto;font-family:Consolas,'Courier New',monospace;font-size:12px;background:#0b1220;border-radius:8px;padding:12px}
.log-linha{display:flex;gap:10px;padding:3px 0;align-items:baseline}
.log-hora{color:var(--muted);flex:0 0 auto}
.log-nivel{flex:0 0 auto;font-weight:700;padding:0 6px;border-radius:4px;font-size:10px}
.log-nivel.info{color:#93c5fd;background:rgba(59,130,246,.15)}
.log-nivel.ok{color:#4ade80;background:rgba(34,197,94,.15)}
.log-nivel.aviso{color:#fbbf24;background:rgba(245,158,11,.15)}
.log-nivel.erro{color:#f87171;background:rgba(239,68,68,.15)}
.log-msg{color:#e2e8f0;word-break:break-word}
/* Ações */
.acoes-lista{display:flex;flex-direction:column;gap:10px}
.acao{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:14px;border:1px solid var(--line);border-radius:10px;background:var(--card2)}
.acao .info{display:flex;flex-direction:column;gap:2px}
.acao .info strong{font-size:14px}
.acao .info span{font-size:12px;color:var(--muted)}
.acao button{padding:8px 16px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--text);font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;white-space:nowrap}
.acao button:hover{background:#475569}
.acao button.primario{background:var(--green);border-color:var(--green);color:#052e16}
.acao button.primario:hover{background:#16a34a}
.acao button.perigo{background:var(--red);border-color:var(--red);color:#fff}
.acao button.perigo:hover{background:#dc2626}
.backups{display:flex;flex-direction:column;gap:6px;margin-top:10px;max-height:200px;overflow-y:auto}
.backup-linha{display:flex;justify-content:space-between;gap:12px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card2);font-size:12px}
.backup-linha .nome{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:Consolas,monospace}
/* Diagnóstico */
.diag{display:flex;flex-direction:column;gap:8px}
.diag-item{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card2)}
.diag-item.ok{border-color:#166534}
.diag-item.atencao{border-color:#92400e}
.diag-item.erro{border-color:#991b1b}
.diag-ico{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;flex:0 0 auto}
.diag-item.ok .diag-ico{background:rgba(34,197,94,.2);color:var(--green)}
.diag-item.atencao .diag-ico{background:rgba(245,158,11,.2);color:var(--amber)}
.diag-item.erro .diag-ico{background:rgba(239,68,68,.2);color:var(--red)}
.diag-item > div{display:flex;flex-direction:column;gap:1px}
.diag-item strong{font-size:13px}
.diag-item span{font-size:12px;color:var(--muted)}
/* Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px}
.modal{background:var(--card);border:1px solid var(--line);border-radius:12px;width:100%;max-width:440px;padding:22px}
.modal h3{font-size:16px;font-weight:700;margin-bottom:10px}
.modal p{font-size:13px;color:var(--muted);line-height:1.5;margin-bottom:16px}
.modal-acoes{display:flex;gap:10px;justify-content:flex-end}
.modal-acoes button{padding:9px 16px;border-radius:8px;border:1px solid var(--line);background:var(--card2);color:var(--text);font-size:13px;font-weight:600;cursor:pointer;font-family:inherit}
.modal-acoes button.primario{background:var(--green);border-color:var(--green);color:#052e16}
.modal-acoes button.perigo{background:var(--red);border-color:var(--red);color:#fff}
.zerar-lista{display:flex;flex-direction:column;gap:8px;margin-bottom:16px;max-height:240px;overflow-y:auto}
.zerar-item{display:flex;align-items:center;gap:10px;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:var(--card2);cursor:pointer}
.zerar-item.ativa{border-color:var(--red)}
.zerar-item input{accent-color:var(--red)}
.zerar-item span{font-size:13px}
.zerar-item small{display:block;font-size:11px;color:var(--muted)}
.msg{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--card2);border:1px solid var(--line);padding:12px 20px;border-radius:8px;font-size:13px;z-index:60;opacity:0;transition:opacity .3s}
.msg.visivel{opacity:1}
.msg.ok{border-color:var(--green);color:var(--green)}
.msg.erro{border-color:var(--red);color:var(--red)}
</style>
</head>
<body>
<div class="sidebar">
  <div class="brand">
    <div class="logo">S</div>
    <h1>Servidor<small>Sistema Loja Tabacaria</small></h1>
  </div>
  <nav class="menu">
    <div class="menu-titulo">Ações</div>
    <button class="menu-item" data-tela="suporte"><span class="ico">🛟</span> Suporte</button>
    <button class="menu-item" data-tela="backup"><span class="ico">💾</span> Copiar (Backup)</button>
    <button class="menu-item" data-tela="restaurar"><span class="ico">↩️</span> Restaurar</button>
    <button class="menu-item" data-tela="corrigir"><span class="ico">🛠️</span> Corrigir</button>
    <button class="menu-item" data-tela="zerar"><span class="ico">🧹</span> Zerar</button>
    <button class="menu-item" data-tela="importar"><span class="ico">📥</span> Importar Dados</button>
    <div class="menu-titulo">Sistema</div>
    <button class="menu-item" data-tela="info"><span class="ico">ℹ️</span> Informações</button>
    <button class="menu-item" data-tela="logs"><span class="ico">📄</span> Logs</button>
    <button class="menu-item" data-tela="catalogo"><span class="ico">🌐</span> Catálogo Online</button>
  </nav>
  <div class="sidebar-rodape">
    <div class="status">
      <span class="dot" id="rodapeDot"></span>
      <span id="rodapeStatus">Conectando...</span>
    </div>
    <span id="rodapeUrl"></span>
  </div>
</div>

<div class="main">
  <div class="topo">
    <h2 id="tituloTela">Servidor</h2>
    <div class="topo-acoes">
      <button id="btnMinimizar">— Minimizar</button>
      <button id="btnSair" class="sair">✕ Encerrar</button>
    </div>
  </div>
  <div class="conteudo" id="conteudo"></div>
</div>

<div class="msg" id="msg"></div>
<div class="modal-overlay" id="modalOverlay" style="display:none"></div>

<script>
let baseUrl = 'http://localhost:' + (new URLSearchParams(location.search).get('porta') || '3210')
let telaAtual = 'backup'
let msgTimer = null

// ---------- Util ----------
function fmtBytes(b){ if(!b) return '—'; if(b<1024) return b+' B'; if(b<1048576) return (b/1024).toFixed(1)+' KB'; return (b/1048576).toFixed(2)+' MB' }
function fmtData(iso){ if(!iso) return '—'; try{ return new Date(iso).toLocaleString('pt-BR') }catch{ return iso } }
function esc(s){ return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;') }
function mostrarMsg(texto, ok){ const m=document.getElementById('msg'); m.textContent=texto; m.className='msg visivel '+(ok?'ok':'erro'); clearTimeout(msgTimer); msgTimer=setTimeout(()=>m.classList.remove('visivel'),3500) }
async function api(path, opts){ const r=await fetch(baseUrl+path, opts); if(!r.ok) throw new Error('HTTP '+r.status); return r.json() }

// ---------- Modal ----------
function abrirModal(html, onConfirma){
  const o=document.getElementById('modalOverlay')
  o.innerHTML='<div class="modal" style="display:block">'+html+'</div>'
  o.style.display='flex'
  o.onclick=(e)=>{ if(e.target===o) fecharModal() }
  const conf=o.querySelector('[data-confirma]')
  if(conf) conf.onclick=async ()=>{ conf.disabled=true; try{ await onConfirma() } finally { fecharModal() } }
  const can=o.querySelector('[data-cancela]')
  if(can) can.onclick=()=>fecharModal()
}
function fecharModal(){ document.getElementById('modalOverlay').style.display='none' }

// ---------- Navegação ----------
function navegar(tela){
  telaAtual=tela
  document.querySelectorAll('.menu-item').forEach(b=>b.classList.toggle('ativa', b.dataset.tela===tela))
  const nomes={suporte:'Suporte',backup:'Copiar (Backup)',restaurar:'Restaurar',corrigir:'Corrigir',zerar:'Zerar',importar:'Importar Dados',info:'Informações do Sistema',logs:'Log do Servidor',catalogo:'Catálogo Online'}
  document.getElementById('tituloTela').textContent=nomes[tela]||'Servidor'
  renderizar()
}
document.querySelectorAll('.menu-item').forEach(b=>b.addEventListener('click',()=>navegar(b.dataset.tela)))
document.getElementById('btnMinimizar').addEventListener('click',()=>{ try { window.servidorJanela.minimizar() } catch {} })
document.getElementById('btnSair').addEventListener('click',()=>{
  abrirModal('<h3>Encerrar servidor</h3><p>Tem certeza que deseja encerrar o servidor? O sistema ficará sem conexão.</p><div class="modal-acoes"><button data-cancela>Cancelar</button><button data-confirma class="perigo">Encerrar</button></div>',
    async ()=>{ try{ await fetch(baseUrl+'/api/servidor/encerrar',{method:'POST'}) }catch(e){} ; try { window.servidorJanela.encerrar() } catch(e2) { window.close() } })
})

// ---------- Telas ----------
function renderizar(){
  const c=document.getElementById('conteudo')
  if(telaAtual==='backup') renderBackup(c)
  else if(telaAtual==='restaurar') renderRestaurar(c)
  else if(telaAtual==='corrigir') renderCorrigir(c)
  else if(telaAtual==='zerar') renderZerar(c)
  else if(telaAtual==='info') renderInfo(c)
  else if(telaAtual==='logs') renderLogs(c)
  else if(telaAtual==='catalogo') renderCatalogo(c)
  else if(telaAtual==='importar') renderImportar(c)
  else renderSuporte(c)
}

function renderCatalogo(c){
  c.innerHTML='<div class="secao"><h3>Catálogo Online</h3>'+
    '<p style="font-size:13px;color:var(--muted);line-height:1.5;margin-bottom:14px">A conexão do catálogo é mantida automaticamente. Use o botão abaixo para reparar/atualizar a conexão quando o catálogo parar de responder.</p>'+
    '<div class="acao"><div class="info"><strong>Conexão do catálogo</strong>'+
    '<span id="releStatus" style="font-size:12px;color:var(--muted)">Verificando...</span></div>'+
    '<button class="primario" onclick="repararCatalogo(this)">Reparar conexão</button></div></div>'
  carregarStatusCatalogo()
}

function carregarStatusCatalogo(){
  const s=document.getElementById('releStatus')
  fetch(baseUrl+'/api/catalogo/conexao').then(r=>{
    if(!r.ok) throw new Error('HTTP '+r.status)
    return r.json()
  }).then(d=>{
    if(s) s.textContent = (d.ok && (d.token_relay_configurado||d.token_sync_configurado)) ? 'Conectado.' : 'Não conectado.'
  }).catch(()=>{
    if(s) s.textContent='Não conectado.'
  })
}

function repararCatalogo(btn){
  if(btn){ btn.disabled=true; btn.textContent='Conectando...' }
  const s=document.getElementById('releStatus')
  if(s) s.textContent='Conectando...'
  fetch(baseUrl+'/api/catalogo/repair',{method:'POST'}).then(r=>r.json()).then(d=>{
    if(d.ok){
      if(s) s.textContent='Conectado.'
      mostrarMsg('Catálogo conectado e atualizado com sucesso.',true)
    }else{
      if(s) s.textContent='Não conectado.'
      mostrarMsg('Não foi possível conectar ao catálogo online agora. Tente novamente em instantes.',false)
    }
  }).catch(()=>{
    if(s) s.textContent='Não conectado.'
    mostrarMsg('Não foi possível conectar ao catálogo online agora. Tente novamente em instantes.',false)
  }).finally(()=>{
    if(btn){ btn.disabled=false; btn.textContent='Reparar conexão' }
  })
}

function renderSuporte(c){
  c.innerHTML='<div class="secao"><h3>Central de Suporte</h3><div class="acoes-lista">'+
    '<div class="acao"><div class="info"><strong>Documentação</strong><span>Manual e ajuda do sistema</span></div><button onclick="mostrarMsg(\'Documentação em breve\',true)">Abrir ajuda</button></div>'+
    '<div class="acao"><div class="info"><strong>WhatsApp de suporte</strong><span>Fale com o suporte técnico</span></div><button onclick="mostrarMsg(\'WhatsApp de suporte indisponível no momento\',false)">Contato</button></div>'+
    '</div></div>'
}

function renderBackup(c){
  c.innerHTML='<div class="secao"><h3>Copiar (Backup)</h3><p style="font-size:13px;color:var(--muted);margin-bottom:14px">Crie uma cópia de segurança completa dos dados do sistema.</p>'+
    '<div class="acoes-lista"><div class="acao"><div class="info"><strong>Criar backup agora</strong><span id="ultimoBackup">Último: carregando...</span></div>'+
    '<button class="primario" onclick="criarBackup()">Criar Backup Agora</button></div></div>'+
    '<div id="listaBackups" class="backups"></div></div>'
  carregarBackupInfo()
}

function renderRestaurar(c){
  c.innerHTML='<div class="secao"><h3>Restaurar</h3><p style="font-size:13px;color:var(--muted);margin-bottom:14px">Selecione um backup para restaurar. Esta operação substitui os dados atuais.</p>'+
    '<div class="acoes-lista"><div class="acao"><div class="info"><strong>Restaurar de backup</strong><span>Substitui os dados atuais pelo backup selecionado</span></div>'+
    '<button class="perigo" onclick="abrirRestaurar()">Restaurar...</button></div></div></div>'
}

function renderCorrigir(c){
  c.innerHTML='<div class="secao"><h3>Corrigir</h3><p style="font-size:13px;color:var(--muted);margin-bottom:14px">Verifica e repara erros no banco de dados e inconsistências do sistema.</p>'+
    '<div class="acoes-lista"><div class="acao"><div class="info"><strong>Verificar e corrigir</strong><span>Executa diagnóstico e correções seguras</span></div>'+
    '<button class="primario" onclick="rodarDiag()">Verificar agora</button></div></div>'+
    '<div id="diagArea" style="margin-top:14px"></div></div>'
}

function renderZerar(c){
  c.innerHTML='<div class="secao"><h3>Zerar</h3><p style="font-size:13px;color:var(--muted);margin-bottom:14px">Limpeza controlada dos dados. Confirmação em duas etapas.</p>'+
    '<div class="acoes-lista">'+
    '<div class="acao"><div class="info"><strong>Zerar TUDO</strong><span>Apaga todos os dados do sistema, sem exceção: produtos, vendas, clientes, usuários e configurações</span></div>'+
    '<button class="perigo" onclick="abrirZerarTudo()">Zerar Tudo</button></div>'+
    '<div class="acao"><div class="info"><strong>Zerar dados selecionados</strong><span>Escolha o que deseja limpar</span></div>'+
    '<button class="perigo" onclick="abrirZerar()">Zerar...</button></div></div></div>'
}

function renderImportar(c){
  c.innerHTML='<div class="secao"><h3>Importar Dados</h3><p style="font-size:13px;color:var(--muted);margin-bottom:14px">Envie um arquivo ZIP com planilhas (CSV, Excel ou JSON) e importe os produtos. O servidor extrai o arquivo e importa automaticamente.</p>'+
    '<div class="acoes-lista">'+
    '<div class="acao"><div class="info"><strong>Importar Backup Nex (.nx1)</strong><span>Envie o ZIP de backup do Nex — importa produtos, clientes, categorias, marcas, vendas, pagamentos e unidades automaticamente</span></div>'+
    '<input type="file" id="nexArquivo" accept=".zip" style="display:none" onchange="enviarNex(this)"><button class="primario" onclick="document.getElementById(\'nexArquivo\').click()">Selecionar ZIP Nex</button></div>'+
    '<div class="acao"><div class="info"><strong>Analisar Backup Nex</strong><span>Verifica as estruturas encontradas no ZIP sem importar nada (dry-run)</span></div>'+
    '<input type="file" id="nexAnalise" accept=".zip" style="display:none" onchange="analisarNexFile(this)"><button onclick="document.getElementById(\'nexAnalise\').click()" style="padding:8px 14px;border-radius:8px;border:1px solid var(--line);background:var(--card2);color:var(--text);font-size:12px;cursor:pointer;font-family:inherit">Analisar ZIP</button></div>'+
    '<div class="acao"><div class="info"><strong>Enviar arquivo ZIP</strong><span>Selecione um .zip com as planilhas de produtos dentro</span></div>'+
    '<input type="file" id="impArquivo" accept=".zip" style="display:none" onchange="enviarZip(this)"><button class="primario" onclick="document.getElementById(\'impArquivo\').click()">Selecionar ZIP</button></div></div>'+
    '<div id="impStatus" style="margin-top:14px;font-size:13px;color:var(--muted)">Nenhum arquivo enviado ainda.</div>'+
    '<div id="impProgresso" style="margin-top:14px;display:none">'+
      '<div style="display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:6px"><span id="impProgMsg">...</span><span id="impProgPct">0%</span></div>'+
      '<div style="height:10px;background:var(--card2);border:1px solid var(--line);border-radius:6px;overflow:hidden"><div id="impProgBar" style="height:100%;width:0%;background:var(--green);transition:width .3s"></div></div>'+
    '</div>'+
    '<div id="impArquivos" style="margin-top:14px"></div></div>'
  carregarArquivosImportacao()
}

async function enviarNex(input){
  const arquivo=input.files&&input.files[0]
  if(!arquivo) return
  const st=document.getElementById('impStatus')
  if(st) st.textContent='Enviando backup Nex '+arquivo.name+' ('+fmtBytes(arquivo.size)+')...'
  const ini=Date.now()
  try{
    const d=await enviaArquivo('/api/importar/nex', arquivo, arquivo.name,
      (l,t)=>mostrarBarraUpload('Enviando backup Nex... '+fmtBytes(l)+' de '+fmtBytes(t),l,t,ini),

}

let impPolling=null

function fmtTempo(ms){
  if(typeof ms!=='number'||ms<0) return ''
  const s=Math.floor(ms/1000)
  if(s<60) return s+'s'
  const m=Math.floor(s/60)
  if(m<60) return m+'m'+String(s%60).padStart(2,'0')+'s'
  const h=Math.floor(m/60)
  return h+'h'+String(m%60).padStart(2,'0')+'m'
}

function pararPollingNex(){ if(nexPolling){ clearInterval(nexPolling); nexPolling=null } }
function pararPollingProgresso(){ if(impPolling){ clearInterval(impPolling); impPolling=null } }

function mostrarBarraUpload(msg, atual, total, iniMs){
  const box=document.getElementById('impProgresso')
  if(!box) return
  box.style.display='block'
  const tempo=fmtTempo(Date.now()-(iniMs||Date.now()))
  const elm=document.getElementById('impProgMsg'); if(elm) elm.textContent=(msg||'Processando...')+(tempo?' · '+tempo:'')
  const porc=Math.min(100,Math.round((atual||0)/Math.max(1,total||1)*100))
  const elp=document.getElementById('impProgPct'); if(elp) elp.textContent=porc+'%'
  const elb=document.getElementById('impProgBar'); if(elb) elb.style.width=porc+'%'
}

function enviaArquivo(uploadUrl, arquivo, nomeZip, onProgresso, onCorpoEnviado, headersExtras){
  return new Promise((resolve,reject)=>{
    const xhr=new XMLHttpRequest()
    xhr.open('POST',baseUrl+uploadUrl,true)
    xhr.setRequestHeader('Content-Type','application/octet-stream')
    if(nomeZip) xhr.setRequestHeader('x-zip-nome',encodeURIComponent(nomeZip))
    if(headersExtras) for(const k in headersExtras) xhr.setRequestHeader(k,headersExtras[k])
    let corpoIniciado=false
    xhr.upload.onprogress=(e)=>{ if(e.lengthComputable&&onProgresso) onProgresso(e.loaded,e.total) }
    xhr.upload.onload=()=>{ if(!corpoIniciado){ corpoIniciado=true; if(onCorpoEnviado) onCorpoEnviado() } }
    xhr.onload=()=>{
      if(xhr.status>=200&&xhr.status<300){ resolve(xhr.response||{}); return }
      const body=xhr.response||{}
      reject(new Error(body&&body.erro?body.erro:'HTTP '+xhr.status))
    }
    xhr.onerror=()=>reject(new Error('Falha de rede'))
    xhr.send(arquivo)
  })
}

function mostrarProgresso(p){
  const box=document.getElementById('impProgresso')
  if(!box) return
  if(!p||!p.ativo){ box.style.display='none'; return }
  box.style.display='block'
  const msg=document.getElementById('impProgMsg')
  const pct=document.getElementById('impProgPct')
  const bar=document.getElementById('impProgBar')
  if(msg){
    const txt=p.mensagem||'Processando...'
    const tempo=fmtTempo(p.decorrido)
    msg.textContent=tempo?txt+' · '+tempo:txt
  }
  const total=Math.max(1,p.total||1)
  const porc=Math.min(100,Math.round((p.atual||0)/total*100))
  if(pct) pct.textContent=porc+'%'
  if(bar) bar.style.width=porc+'%'
}

function iniciarPollingProgresso(){
  if(impPolling) clearInterval(impPolling)
  impPolling=setInterval(async ()=>{
    try{
      const d=await api('/api/importar/progresso')
      mostrarProgresso(d)
    }catch{}
  },400)
}

async function enviarZip(input){
  const arquivo=input.files&&input.files[0]
  if(!arquivo) return
  const st=document.getElementById('impStatus')
  if(st) st.textContent='Enviando '+arquivo.name+' ('+fmtBytes(arquivo.size)+')...'
  const ini=Date.now()
  try{
    const d=await enviaArquivo('/api/importar/zip', arquivo, arquivo.name,
      (l,t)=>mostrarBarraUpload('Enviando '+arquivo.name+' '+fmtBytes(l)+' de '+fmtBytes(t),l,t,ini),
      ()=>iniciarPollingProgresso())
    mostrarProgresso({ativo:false})
    if(st) st.innerHTML='<span style="color:var(--green)">ZIP enviado e extraído!</span> '+(d.arquivos&&d.arquivos.length?d.arquivos.length+' arquivo(s) de dados encontrados.':'Nenhum arquivo de dados encontrado.')
    input.value=''
    carregarArquivosImportacao()
  }catch(e){
    if(st) st.innerHTML='<span style="color:var(--red)">Erro ao enviar: '+esc(e.message)+'</span>'
  }finally{
    pararPollingNex()
    pararPollingProgresso()
    mostrarProgresso({ativo:false})
  }
}

async function importarArquivo(nomeArquivo){
  const caminho=(nomeArquivo||'').replace(/\\/g,'/')
  try{
    const d=await api('/api/importar/arquivo',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({arquivo:caminho})})
    if(!d.ok){ mostrarMsg(d.erro||'Falha ao ler arquivo',false); return }
    const linhas=d.linhas||[]
    if(linhas.length===0){ mostrarMsg('Arquivo vazio.',false); return }
    if(!confirm('Importar produtos de "'+caminho+'" ('+linhas.length+' linha(s))? Categorias, marcas e fornecedores novos serão criados automaticamente.')) return
    const st=document.getElementById('impStatus')
    if(st) st.textContent='Importando produtos...'
    iniciarPollingProgresso()
    try{
      const r=await api('/api/importar/produtos',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({arquivo:caminho})})
      if(st) st.innerHTML='<span style="color:var(--green)">Importação concluída: '+r.criados+' criado(s), '+r.atualizados+' atualizado(s)'+(r.semPreco?' · '+r.semPreco+' sem preço':'')+'</span>'
      if(r.erros&&r.erros.length) mostrarMsg(r.erros.length+' erro(s) na importação',false)
      else mostrarMsg('Produtos importados com sucesso!',true)
    }finally{
      pararPollingNex()
      pararPollingProgresso()
      mostrarProgresso({ativo:false})
    }
  }catch(e){
    mostrarMsg('Erro: '+e.message,false)
  }
}

async function limparImportacao(){
  if(!confirm('Limpar os arquivos extraídos?')) return
  try{

    const st=document.getElementById('impStatus'); if(st) st.textContent='Nenhum arquivo enviado ainda.'

async function abrirRestaurar(){
  try{
    const d=await api('/api/servidor/backup/info')

    if(backups.length===0){ mostrarMsg('Nenhum backup disponível para restaurar',false); return }
    abrirModal('<h3>Restaurar backup</h3><p>Selecione o backup e confirme. Isso substituirá TODOS os dados atuais.</p>'+
      '<div class="backups" style="max-height:200px">'+backups.slice(0,10).map((b,i)=>'<label style="display:flex;gap:8px;align-items:center;padding:8px;border:1px solid var(--line);border-radius:8px;cursor:pointer;font-size:12px"><input type="radio" name="bk" value="'+esc(b.nome)+'" '+(i===0?'checked':'')+'><span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:Consolas,monospace">'+esc(b.nome)+'</span><span style="color:var(--muted)">'+fmtBytes(b.tamanho)+'</span></label>').join('')+'</div>'+
      '<div class="modal-acoes" style="margin-top:14px"><button data-cancela>Cancelar</button><button data-confirma class="perigo">Restaurar agora</button></div>',
      async ()=>{
        const sel=document.querySelector('input[name=bk]:checked')

        try{
          const r=await api('/api/servidor/restaurar',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({arquivo:sel.value})})
          mostrarMsg(r.ok?'Backup restaurado com sucesso!':'Falha: '+(r.erro||'erro'), r.ok)
        }catch(e){ mostrarMsg('Erro: '+e.message,false) }
      })

}

    const d=await api('/api/servidor/diagnostico',{method:'POST'})

    area.innerHTML='<div class="diag">'+itens.map(i=>'<div class="diag-item '+i.status+'"><span class="diag-ico">'+(i.status==='ok'?'✓':i.status==='atencao'?'⚠':'✗')+'</span><div><strong>'+esc(i.nome)+'</strong><span>'+esc(i.detalhe)+'</span></div></div>').join('')+'</div>'
